name: genie_en_herbe
description: "Génie en herbe — des concours de questions sur vos documents."
publish_to: 'none'

version: 1.1.0+4

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  path_provider: ^2.1.6
  intl: ^0.20.3
  http: ^1.6.0
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  web: ^1.1.2
  archive: ^4.6.0
  xml: ^7.1.0
  file_picker: ^13.3.3
  pdfrx: ^2.12.0
  google_mlkit_text_recognition: ^1.0.1
  google_mlkit_document_scanner: ^0.7.1
  wakelock_plus: ^1.8.2
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0
  app_links: ^7.2.2
  mobile_scanner: 7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  image_path: "assets/branding/icon-full.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#2E6B30"
  adaptive_icon_foreground: "assets/branding/icon-foreground.png"
